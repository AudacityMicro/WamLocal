name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") { throw 'Tag must match package.json version' }
      - run: npm test -- --maxWorkers=2
      - run: npm run verify:mcp
      - run: npm run package
      - run: node scripts/verify-release.mjs
      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:WAM_MCP_EXE = Join-Path $PWD 'release/win-unpacked/Wam Local.exe'
          npx tsx scripts/verify-mcp-guide.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsx scripts/verify-mcp-workbench.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsx scripts/verify-step.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: wam-local-windows-installer
          if-no-files-found: error
          path: |
            release/Wam-Local-Setup.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wam-local-windows-installer
          path: release
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release/* --repo "$RELEASE_REPO" --verify-tag --title "Wam Local $RELEASE_TAG" --notes-file RELEASE-NOTES.md --draft
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
